<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Think Mart</title>

    <link rel="stylesheet" href="../style/index.css">

</head>

<body>


<header>

    <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXS4t0fqUwRF70D-rAYZcaXD6xykAmzIIiO50ZAql1Cg&s"
        alt="Think Mart Logo">

    <nav>

        <ol>

            <li><a href="./index.html">Home</a></li>

            <li><a href="./Products.html">Products</a></li>

            <li><a href="./Cart.html">Cart</a></li>

            <li><a href="./About.html">About</a></li>

            <li><a href="./Contact.html">Contact</a></li>

            <li><a href="./Login.html">Logout</a></li>

        </ol>

    </nav>

</header>


<section class="page-banner">

    <h1>Contact Us</h1>

    <p>We would love to hear from you</p>

</section>


<div class="contact-container">


    <div class="contact-info">

        <h2>Get In Touch</h2>

        <p>📍 Guntur, Andhra Pradesh, India</p>

        <p>📧 support@thinkmart.com</p>

        <p>📞 +91 98765 43210</p>

        <p>🕒 Monday - Saturday: 9 AM - 7 PM</p>

    </div>


    <div class="contact-form">

        <h2>Send Us a Message</h2>

        <form>

            <input
                type="text"
                placeholder="Enter your name"
                required>

            <input
                type="email"
                placeholder="Enter your email"
                required>

            <input
                type="text"
                placeholder="Subject"
                required>

            <textarea
                placeholder="Write your message..."
                required></textarea>

            <button class="submit-btn" type="submit">
                Send Message
            </button>

        </form>

    </div>


</div>





</body>

</html>
