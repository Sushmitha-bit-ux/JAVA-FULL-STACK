<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - Think Mart</title>

    <link rel="stylesheet" href="../style/index.css">

</head>

<body>


<header>

    <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXS4t0fqUwRF70D-rAYZcaXD6xykAmzIIiO50ZAql1Cg&s"
        alt="Think Mart Logo">

    <nav>

        <ol>

            <li><a href="./index.html">Home</a></li>

            <li><a href="./Products.html">Products</a></li>

            <li><a href="./Cart.html">Cart</a></li>

            <li><a href="./About.html">About</a></li>

            <li><a href="./Contact.html">Contact</a></li>

            <li><a href="./Login.html">Logout</a></li>

        </ol>

    </nav>

</header>


<section class="page-banner">

    <h1>Shopping Cart</h1>

    <p>Your selected products</p>

</section>


<div class="cart-container">


    <div class="cart-item">

        <img
            src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=80"
            alt="Laptop">

        <div class="cart-details">

            <h2>HP Laptop</h2>

            <p>Quantity: 1</p>

            <p class="cart-price">₹75,000</p>

        </div>

        <button class="remove-btn">
            Remove
        </button>

    </div>


    <div class="cart-item">

        <img
            src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
            alt="Headphones">

        <div class="cart-details">

            <h2>Wireless Headphones</h2>

            <p>Quantity: 1</p>

            <p class="cart-price">₹8,999</p>

        </div>

        <button class="remove-btn">
            Remove
        </button>

    </div>


    <div class="total-box">

        <h2>Total: ₹83,999</h2>

        <button class="checkout-btn">
            Proceed to Checkout
        </button>

    </div>


</div>





</body>

</html>
