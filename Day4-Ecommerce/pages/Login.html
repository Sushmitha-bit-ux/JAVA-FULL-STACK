    <nav>

<div class="login-container">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <form action="./index.html">

            <label>Email</label>

            <input
                type="email"
                placeholder="Enter your email"
                required>


            <label>Password</label>

            <input
                type="password"
                placeholder="Enter your password"
                required>


            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>

</footer>
